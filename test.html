<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Portfolio - Skills</title>

  <!-- Font Awesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"/>

  <!-- Google Font -->
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Poppins', sans-serif;
    }

    body {
      background: radial-gradient(circle at top, #1a0b2e, #0b0417);
      color: #ffffff;
    }

    /* ===== SKILLS SECTION ===== */
    .skills-section {
      padding: 100px 20px;
      min-height: 100vh;
    }

    .container {
      max-width: 1150px;
      margin: auto;
    }

    .section-title {
      text-align: center;
      font-size: 40px;
      font-weight: 700;
      margin-bottom: 10px;
      background: linear-gradient(90deg, #a855f7, #d946ef);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .section-subtitle {
      text-align: center;
      color: #c4b5fd;
      margin-bottom: 60px;
      font-size: 16px;
    }

    .skills-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 30px;
    }

    .skill-card {
      position: relative;
      background: linear-gradient(180deg, rgba(168,85,247,0.08), rgba(0,0,0,0));
      border: 1px solid rgba(168,85,247,0.3);
      border-radius: 18px;
      padding: 40px 25px;
      text-align: center;
      transition: all 0.35s ease;
      overflow: hidden;
    }

    .skill-card::before {
      content: "";
      position: absolute;
      inset: 0;
      background: radial-gradient(circle at top, rgba(168,85,247,0.25), transparent 60%);
      opacity: 0;
      transition: opacity 0.35s ease;
    }

    .skill-card i {
      font-size: 48px;
      color: #c084fc;
      margin-bottom: 18px;
      z-index: 1;
      position: relative;
    }

    .skill-card h4 {
      font-size: 20px;
      font-weight: 600;
      margin-bottom: 8px;
      z-index: 1;
      position: relative;
    }

    .skill-card span {
      font-size: 14px;
      color: #ddd6fe;
      z-index: 1;
      position: relative;
    }

    .skill-card:hover {
      transform: translateY(-12px);
      border-color: #d946ef;
      box-shadow: 0 25px 60px rgba(168,85,247,0.35);
    }

    .skill-card:hover::before {
      opacity: 1;
    }

    /* ===== RESPONSIVE ===== */
    @media (max-width: 480px) {
      .section-title {
        font-size: 30px;
      }
    }
  </style>
</head>
<body>

  <!-- SKILLS -->
  <section id="skills" class="skills-section">
    <div class="container">
      <h2 class="section-title">My Skills</h2>
      <p class="section-subtitle">Technologies & expertise I work with</p>

      <div class="skills-grid">
        <div class="skill-card">
          <i class="fab fa-html5"></i>
          <h4>HTML</h4>
          <span>Advanced</span>
        </div>

        <div class="skill-card">
          <i class="fab fa-css3-alt"></i>
          <h4>CSS</h4>
          <span>Advanced</span>
        </div>

        <div class="skill-card">
          <i class="fab fa-js"></i>
          <h4>JavaScript</h4>
          <span>Intermediate</span>
        </div>

        <div class="skill-card">
          <i class="fab fa-bootstrap"></i>
          <h4>Bootstrap</h4>
          <span>Intermediate</span>
        </div>

        <div class="skill-card">
          <i class="fas fa-network-wired"></i>
          <h4>Networking</h4>
          <span>Basic</span>
        </div>

        <div class="skill-card">
          <i class="fas fa-tools"></i>
          <h4>IT Support</h4>
          <span>Basic</span>
        </div>
      </div>
    </div>
  </section>

</body>
</html>
